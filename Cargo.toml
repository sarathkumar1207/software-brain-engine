[workspace]
members = [
  "crates/common",
  "crates/scanner",
  "crates/storage",
  "crates/parser",
  "crates/symbols",
  "crates/graph",
  "crates/impact",
  "crates/query",
  "crates/indexer",
  "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
petgraph = "0.6"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tracing = "0.1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
walkdir = "2"

sbe-common = { path = "crates/common" }
sbe-scanner = { path = "crates/scanner" }
sbe-storage = { path = "crates/storage" }
sbe-parser = { path = "crates/parser" }
sbe-symbols = { path = "crates/symbols" }
sbe-graph = { path = "crates/graph" }
sbe-impact = { path = "crates/impact" }
sbe-query = { path = "crates/query" }
sbe-indexer = { path = "crates/indexer" }
