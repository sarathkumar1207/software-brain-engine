name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.2.0"
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: sbe-windows-x64
            core_asset: sbe-core-windows-x64.exe
          - name: linux-x64
            os: ubuntu-latest
            artifact: sbe-linux-x64
            core_asset: sbe-core-linux-x64
          - name: macos-x64
            os: macos-13
            artifact: sbe-macos-x64
            core_asset: sbe-core-macos-x64
          - name: macos-arm64
            os: macos-latest
            artifact: sbe-macos-arm64
            core_asset: sbe-core-macos-arm64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --workspace
      - run: cargo build --release -p sbe-cli

      - name: Package Windows MSI
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install wixtoolset --no-progress -y
          $version = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.2.0" }
          .\scripts\build-msi.ps1 -Version "$version" -OutputDir artifacts
          Copy-Item target\release\sbe.exe artifacts\${{ matrix.core_asset }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/release/sbe artifacts/sbe
          cp target/release/sbe artifacts/${{ matrix.core_asset }}
          chmod +x artifacts/${{ matrix.core_asset }}
          tar -czf artifacts/${{ matrix.artifact }}.tar.gz -C artifacts sbe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.core_asset }}
            artifacts/*.msi
            artifacts/*.tar.gz

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum sbe-core-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: release-artifacts/*
          generate_release_notes: true
