name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.2.0"
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: sbe-windows-x64
            core_asset: sbe-core-windows-x64.exe
            rust_target: ""
            binary_path: target\release\sbe.exe
          - name: linux-x64
            os: ubuntu-latest
            artifact: sbe-linux-x64
            core_asset: sbe-core-linux-x64
            rust_target: x86_64-unknown-linux-gnu
            binary_path: target/x86_64-unknown-linux-gnu/release/sbe
          - name: macos-x64
            os: macos-latest
            artifact: sbe-macos-x64
            core_asset: sbe-core-macos-x64
            rust_target: x86_64-apple-darwin
            binary_path: target/x86_64-apple-darwin/release/sbe
          - name: macos-arm64
            os: macos-latest
            artifact: sbe-macos-arm64
            core_asset: sbe-core-macos-arm64
            rust_target: aarch64-apple-darwin
            binary_path: target/aarch64-apple-darwin/release/sbe
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build release binary
        if: runner.os != 'Windows'
        run: cargo build --release -p sbe-cli --target ${{ matrix.rust_target }}

      - name: Build release binary
        if: runner.os == 'Windows'
        run: cargo build --release -p sbe-cli

      - name: Package Windows MSI
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install wixtoolset --no-progress -y
          $version = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.2.0" }
          .\scripts\build-msi.ps1 -Version "$version" -OutputDir artifacts
          Copy-Item "${{ matrix.binary_path }}" artifacts\${{ matrix.core_asset }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp "${{ matrix.binary_path }}" artifacts/sbe
          cp "${{ matrix.binary_path }}" artifacts/${{ matrix.core_asset }}
          chmod +x artifacts/${{ matrix.core_asset }}
          tar -czf artifacts/${{ matrix.artifact }}.tar.gz -C artifacts sbe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.core_asset }}
            artifacts/*.msi
            artifacts/*.tar.gz

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum sbe-core-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: release-artifacts/*
          generate_release_notes: true
