name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: sbe-windows-x64
            core_asset: sbe-core-windows-x64.exe
            rust_target: ""
            binary_path: target\release\sbe.exe
          - name: linux-x64
            os: ubuntu-latest
            artifact: sbe-linux-x64
            core_asset: sbe-core-linux-x64
            rust_target: x86_64-unknown-linux-gnu
            binary_path: target/x86_64-unknown-linux-gnu/release/sbe
          - name: macos-x64
            os: macos-latest
            artifact: sbe-macos-x64
            core_asset: sbe-core-macos-x64
            rust_target: x86_64-apple-darwin
            binary_path: target/x86_64-apple-darwin/release/sbe
          - name: macos-arm64
            os: macos-latest
            artifact: sbe-macos-arm64
            core_asset: sbe-core-macos-arm64
            rust_target: aarch64-apple-darwin
            binary_path: target/aarch64-apple-darwin/release/sbe
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' crates/cli/Cargo.toml | head -n 1)"
          npm_version="$(node -p 'require("./npm/sbe/package.json").version')"

          if [[ "$cargo_version" != "$tag_version" || "$npm_version" != "$tag_version" ]]; then
            echo "Release tag, CLI version, and npm version must match."
            echo "tag=$tag_version cargo=$cargo_version npm=$npm_version"
            exit 1
          fi

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build release binary
        if: runner.os != 'Windows'
        run: cargo build --release -p sbe-cli --target ${{ matrix.rust_target }} --locked

      - name: Build release binary
        if: runner.os == 'Windows'
        run: cargo build --release -p sbe-cli --locked

      - name: Package Windows MSI
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install wixtoolset --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\build-msi.ps1 -Version "$version" -OutputDir artifacts
          Copy-Item "${{ matrix.binary_path }}" artifacts\${{ matrix.core_asset }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp "${{ matrix.binary_path }}" artifacts/sbe
          cp "${{ matrix.binary_path }}" artifacts/${{ matrix.core_asset }}
          chmod +x artifacts/${{ matrix.core_asset }}
          tar -czf artifacts/${{ matrix.artifact }}.tar.gz -C artifacts sbe

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.core_asset }}
            artifacts/*.msi
            artifacts/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum sbe-core-* > checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Dispatch npm publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run npm-publish.yml --ref main --field release_tag="$GITHUB_REF_NAME"
