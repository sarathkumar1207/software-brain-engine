name: Publish npm

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish sbe-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Read package version
        id: package
        working-directory: npm/sbe
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        working-directory: npm/sbe
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          release_version="${{ github.event.release.tag_name }}"
          release_version="${release_version#v}"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "package.json version $package_version does not match release $release_version"
            exit 1
          fi

      - name: Test npm wrapper
        working-directory: npm/sbe
        run: node --test

      - name: Reject an already published version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          if npm view "sbe-cli@$version" version --json >/dev/null 2>&1; then
            echo "::error::sbe-cli@$version is already published. Bump the package version before publishing; npm versions are immutable."
            exit 1
          fi

      - name: Verify matching native release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          assets="$(gh api "repos/${{ github.repository }}/releases/tags/v$version" --jq '.assets[].name')"
          for required in \
            sbe-core-linux-x64 \
            sbe-core-macos-x64 \
            sbe-core-macos-arm64 \
            sbe-core-windows-x64.exe \
            checksums.txt; do
            if ! grep -Fxq "$required" <<< "$assets"; then
              echo "::error::GitHub release v$version is missing required asset: $required"
              exit 1
            fi
          done

      - name: Check npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is not set. The workflow will try npm Trusted Publishing through GitHub OIDC."
            echo "If Trusted Publishing is not configured in npm, add an npm Automation token as the NPM_TOKEN repository secret."
            exit 0
          fi
          npm whoami --registry=https://registry.npmjs.org

      - name: Publish package
        working-directory: npm/sbe
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set +e
          output="$(npm publish --access public --provenance 2>&1)"
          status=$?
          echo "$output"
          if [[ "$status" -ne 0 ]] && grep -q "EOTP" <<< "$output"; then
            echo "::error::npm requires a one-time password. GitHub Actions cannot provide interactive OTP. Replace NPM_TOKEN with an npm Automation token, or configure npm Trusted Publishing for this GitHub repository and workflow."
          fi
          exit "$status"
