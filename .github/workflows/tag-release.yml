name: Tag Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tag-release-main
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Create version tag when needed
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' crates/cli/Cargo.toml | head -n 1)"
          tag="v$version"
          subject="$(git log -1 --format='%s')"

          if [[ "$subject" != "chore(release): $tag" ]]; then
            echo "Latest commit is not a release commit for $tag; skipping tag creation."
            exit 0
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
