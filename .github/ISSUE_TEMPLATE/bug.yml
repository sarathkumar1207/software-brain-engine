name: Bug report
description: Report reproducible incorrect behavior in SBE.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first and remove sensitive project data from logs.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
      placeholder: SBE returned or created...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest commands and project shape that reproduce the problem.
      placeholder: |
        1. Run `sbe scan ...`
        2. Run `sbe ...`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SBE version
      description: Output from `sbe version` or the package version.
      placeholder: 0.3.0
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - npm
        - GitHub release binary
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and relevant runtime versions.
      placeholder: Windows 11 x64, Node.js 20
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste sanitized output. Do not include secrets or proprietary source code.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private source code from this report.
          required: true
