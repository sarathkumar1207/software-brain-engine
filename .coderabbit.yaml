language: en-US
early_access: false
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  poem: false
  review_status: true
  commit_status: true
  fail_commit_status: true
  path_filters:
    - "!target/**"
    - "!.npm-cache/**"
    - "!docs/**/*.png"
    - "!assets/**"
  path_instructions:
    - path: "crates/**/*.rs"
      instructions: |
        Review for correctness, deterministic behavior, cross-platform filesystem safety,
        stable serialization and storage compatibility, graph accuracy, useful error context,
        and regression tests. Treat silent data loss, false graph edges, stale-index behavior,
        and broken JSON CLI contracts as high-priority findings.
    - path: ".github/workflows/**"
      instructions: |
        Review least-privilege permissions, pinned or trusted actions, release safety,
        secret handling, branch targeting, and reproducible Rust builds.
    - path: "npm/**"
      instructions: |
        Review package metadata, platform binary selection, install behavior, version
        synchronization, and release compatibility with the Rust CLI.
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main

chat:
  auto_reply: true
